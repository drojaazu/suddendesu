baseURL: 'https://sudden-desu.net/'
locale: 'en-us'
title: 'SUDDEN DESU'

module:
  hugoVersion:
    min: '0.164.0'

taxonomies:
  # `category` is a plain display string in entry front matter (rendered by
  # _partials/entry/meta.html), not a browsable taxonomy -- there is no listing
  # template and nothing links to one. Declaring it here only produced a stray
  # term page at the mangled URL /categories/disassembly-/-analysis/.
  tag: tags

Params:
  subtitle: 'disassemblies・digital archaeology・data preservation'
  author: 'Ryou'
  # Accent colour Discord and Slack use for the embed sidebar
  theme_color: '#bd6d0a'
  # og:locale wants underscore form with an uppercase region
  og_locale: 'en_US'
  social:
    twitter: 'suddendesu'
  date_machine: '2006-01-02T15:04:05-07:00'
  date_human: '2006-01-02'
  # NB: do not name this `images` -- that key is the page-level cover-image
  # convention, and .Param "images" would fall back to it site-wide.
  image_rules:
    # at or below this natural width an image is treated as native-resolution
    # pixel art: served untouched and scaled crisply by CSS
    pixel_max_width: 640
    # above this natural width an image is resized to WebP and given a srcset
    large_width: 1200
    # the prose column pixel art is scaled to fit, and the cap on that scaling
    column_width: 900
    pixel_scale_max: 4

menus:
  main:
  - name: Home
    pageRef: /
    weight: 10
  - name: About
    pageRef: /page/about
    weight: 20
  - name: Tags
    pageRef: /tags
    weight: 30
  - name: Twitter
    url: https://twitter.com/suddendesu
    weight: 40
  - name: Bluesky
    url: https://bsky.app/profile/sudden-desu.net
    weight: 50
  - name: Support us on Patreon
    url: https://www.patreon.com/cw/SUDDENDESU
    weight: 60

services:
  googleAnalytics:
    ID: G-K69STSCE8D

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true

minify:
  minifyOutput: true
