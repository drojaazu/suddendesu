{{- /* Loaded from <head> so the font CSS is fetched in parallel with the
       stylesheet rather than after it. Only the families the theme actually
       references are requested. */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;700&family=Inconsolata&family=Cuprum&display=swap">
