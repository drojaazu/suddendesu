{{- /* Very small image, rendered crisply at native size. See partials/img.html. */ -}}
{{- partial "img.html" (dict
      "page" .Page
      "src" (or (.Get "src") (.Get 0))
      "alt" (.Get "alt" | default "")
      "caption" (.Get "caption" | default "")
      "class" "tinyimg"
      "figure" true
) -}}
