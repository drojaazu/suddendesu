{{- /* Small image that can be click-held to zoom. See partials/img.html. */ -}}
{{- partial "img.html" (dict
      "page" .Page
      "src" (or (.Get "src") (.Get 0))
      "alt" (.Get "alt" | default "")
      "caption" (.Get "caption" | default "")
      "imgclass" "zoom"
      "figure" true
) -}}
