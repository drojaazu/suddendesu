{{- /* Large non-screenshot image, e.g. a scan or photo. See partials/img.html. */ -}}
{{- partial "img.html" (dict
      "page" .Page
      "src" (or (.Get "src") (.Get 0))
      "alt" (.Get "alt" | default "")
      "caption" (.Get "caption" | default "")
      "class" "large"
      "figure" true
) -}}
