{{- /* Wide tables (register maps, memory layouts) scroll inside their own box
       instead of forcing the whole page to scroll sideways on narrow screens. */ -}}
<div class="table-scroll">
	<table>
		<thead>
			{{- range .THead }}
			<tr>
				{{- range . }}
				<th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
				{{- end }}
			</tr>
			{{- end }}
		</thead>
		<tbody>
			{{- range .TBody }}
			<tr>
				{{- range . }}
				<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
				{{- end }}
			</tr>
			{{- end }}
		</tbody>
	</table>
</div>
