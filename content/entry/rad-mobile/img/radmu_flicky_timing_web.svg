"10.5" style="font-size:9.33333px" text-anchor="middle"><tspan id="tspan74" x="886" y="196" style="font-size:9.33333px">(Update runs</tspan><tspan id="tspan75" x="886" y="207.66666" style="font-size:9.33333px"><tspan id="tspan76" style="font-weight:700;font-size:9.33333px">after</tspan> code check)</tspan></text></g><g id="lane-start" transform="translate(-12.960001 -117.94166)"><path id="safe-hold" fill="#2b4a33" stroke="#5bbf7a" d="M103.99909 215.9991h270.99838v34.00182H103.99909Z" style="stroke-width:.998183"/><text id="text54" x="240" y="238" fill="#a9e5bd" font-size="13.5" text-anchor="middle">Start may still be held</text><path id="too-late" fill="#3a2020" stroke="#7a3030" d="M375.978 215.97183h544.07379v34.05634H375.978Z" style="stroke-width:.943653"/><text id="text55" x="682" y="238" fill="#e08c8c" font-size="13.5" text-anchor="middle">Start button state locked</text></g><g id="sample-arrow" transform="matrix(1.00024 0 0 .9358 -13.115317 -105.94354)"><path id="path55" fill="none" stroke="#e1850a" stroke-width="2.55301" marker-end="url(#arrow)" d="M410.03632 185.95163v125.16168h475.92837v-33.9454"/><text id="text56" x="640" y="298" class="noteb" text-anchor="middle">the code check reads the input sample (now 7 frames stale)</text></g><g id="markers" transform="translate(-12.960001 -122.42121)"><path id="line56" stroke="#e6e8ec" stroke-width="2" d="M138 332v34"/><circle id="circle56" cx="138" cy="330" r="5" fill="#e6e8ec"/><path id="line57" stroke="#5bbf7a" stroke-width="2" d="M342 332v34"/><circle id="circle57" cx="342" cy="330" r="5" fill="#5bbf7a"/><path id="line58" stroke="#e1850a" stroke-width="2.5" d="M410 332v34"/><circle id="circle58" cx="410" cy="330" r="5" fill="#e1850a"/><path id="line59" stroke="#e1850a" stroke-width="2.5" d="M886 332v34"/><circle id="circle59" cx="886" cy="330" r="5" fill="#e1850a"/></g><g id="callouts" transform="translate(-12.960001 -117.94166)"><text id="text59" x="32" y="392" class="note"><tspan id="tspan59" class="noteb">+0</tspan> Start pressed. The main loop leaves attract and begins building the race.</text><text id="text60" x="32" y="414" class="note">+3 Last frame on which Start may still be pushed.</text><text id="text63" x="32" y="436" class="note"><tspan id="tspan83" style="fill:#e1850a;fill-opacity:1">+4</tspan> Final <tspan id="tspan62" class="mono" style="font-size:10.6667px">update_inputs</tspan> before the stall. Whatever it latches into <tspan id="tspan77" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:10.6667px;font-family:&quot;DejaVu Sans Mono&quot;,&quot;Courier New&quot;,monospace;-inkscape-font-specification:&quot;DejaVu Sans Mono, Courier New, monospace&quot;">0x20F018</tspan> is what decides the input read by the code check..</text><text id="text65" x="32" y="458" class="note">+5 … +10 Six frames of task installation, DMA the Sonic ornament graphics at <tspan id="tspan65" class="mono" style="font-size:10.6667px">0x0669E8,</tspan> and graphics setup. <tspan id="tspan81" style="font-weight:700">The I/O chip is never read.</tspan></text><text id="text69" x="32" y="480" class="note"><tspan id="tspan82" style="fill:#e1850a;fill-opacity:1">+11</tspan><tspan id="tspan67" class="mono" style="font-size:10.6667px">task__mirror_ornament__init</tspan> reaches the gate at <tspan id="tspan78" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:10.6667px;font-family:&quot;DejaVu Sans Mono&quot;,&quot;Courier New&quot;,monospace;-inkscape-font-specification:&quot;DejaVu Sans Mono, Courier New, monospace&quot;">0x00073DA8</tspan>: ~raw_input &amp; 0x610 == 0x600 (Light and Wiper down, Start up).</text><text xml:space="preserve" id="text79" x="57.785866" y="0" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:18.6667px;font-family:&quot;DejaVu Sans Mono&quot;,&quot;Courier New&quot;,monospace;-inkscape-font-specification:&quot;DejaVu Sans Mono, Courier New, monospace&quot;;text-align:center;writing-mode:lr-tb;direction:ltr;white-space:pre;shape-inside:url(#rect79);display:inline;fill:#000;stroke-width:3.77953;-inkscape-stroke:none" transform="translate(-22.059334 -8.631913)"><tspan id="tspan7" x="201.71468" y="291.10074"><tspan id="tspan6" style="font-family:Cuprum,&quot;Trebuchet MS&quot;,&quot;DejaVu Sans&quot;,sans-serif;-inkscape-font-specification:&quot;Cuprum, Trebuchet MS, DejaVu Sans, sans-serif&quot;;fill:#c8ccd4">3 frames at 60 Hz
</tspan></tspan><tspan id="tspan10" x="210.21973" y="326.2978"><tspan id="tspan8" style="font-size:32px;fill:#c8ccd4">≈</tspan><tspan id="tspan9" style="font-size:32px;fill:#c8ccd4"> 50ms</tspan></tspan></text></g></svg>